openapi: 3.0.3
info:
  title: 'Finance Tracker API'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: ''
    description: ''
  -
    name: Auth
    description: "\nRegistrasi, login, logout, dan profil user. Token Sanctum dikirim sebagai `Authorization: Bearer <token>`."
  -
    name: Budgets
    description: "\nAnggaran bulanan tetap per kategori pengeluaran. Berlaku setiap bulan sampai diubah;\nanggaran kategori induk menjumlah subkategorinya."
  -
    name: Categories
    description: "\nKategori pemasukan dan pengeluaran, maksimal dua tingkat."
  -
    name: Dashboard
    description: "\nRingkasan bulanan; batas bulan dihitung di zona Asia/Jakarta."
  -
    name: 'Recurring Rules'
    description: "\nAturan pemasukan atau pengeluaran berulang (harian, mingguan, bulanan). Pada tanggalnya aturan\notomatis menjadi transaksi biasa; kemunculan yang terlewat disusul dengan tanggal aslinya."
  -
    name: Reports
    description: "\nLaporan dihitung langsung dari transaksi. Bulan menurut Asia/Jakarta; transfer tidak dihitung."
  -
    name: Transactions
    description: "\nTransaksi pemasukan dan pengeluaran. Waktu dikirim dengan offset, disimpan UTC, dikembalikan dengan akhiran Z."
  -
    name: Transfers
    description: "\nTransfer antar dompet. Satu transfer = dua baris transaksi dengan transfer_group_id yang sama."
  -
    name: Wallets
    description: "\nDompet. Saldo dihitung dari transaksi, tidak disimpan."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/v1/user:
    get:
      summary: ''
      operationId: getApiV1User
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - ''
  /api/v1/auth/register:
    post:
      summary: 'Daftar akun baru'
      operationId: daftarAkunBaru
      description: ''
      parameters: []
      responses: {}
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: b
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: zbailey@example.net
                password:
                  type: string
                  description: 'Must be at least 8 characters.'
                  example: '-0pBNvYgxw'
              required:
                - name
                - email
                - password
      security: []
  /api/v1/auth/login:
    post:
      summary: 'Masuk dan dapatkan token'
      operationId: masukDanDapatkanToken
      description: ''
      parameters: []
      responses: {}
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - email
                - password
      security: []
  /api/v1/auth/logout:
    post:
      summary: 'Keluar (mencabut token saat ini)'
      operationId: keluarmencabutTokenSaatIni
      description: ''
      parameters: []
      responses: {}
      tags:
        - Auth
  /api/v1/auth/me:
    get:
      summary: 'Profil user yang sedang login'
      operationId: profilUserYangSedangLogin
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Auth
  /api/v1/budgets:
    get:
      summary: 'Daftar anggaran beserta pemakaiannya'
      operationId: daftarAnggaranBesertaPemakaiannya
      description: ''
      parameters:
        -
          in: query
          name: month
          description: 'Bulan `YYYY-MM` (Asia/Jakarta). Default bulan berjalan.'
          example: 2026-11
          required: false
          schema:
            type: string
            description: 'Bulan `YYYY-MM` (Asia/Jakarta). Default bulan berjalan.'
            example: 2026-11
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Budgets
    put:
      summary: 'Atur anggaran kategori (buat atau ubah)'
      operationId: aturAnggaranKategoribuatAtauUbah
      description: 'Mengembalikan 201 jika anggaran baru, 200 jika memperbarui anggaran yang ada.'
      parameters: []
      responses: {}
      tags:
        - Budgets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
                amount:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 9007199254740991.'
                  example: 7
              required:
                - category_id
                - amount
  '/api/v1/budgets/{budget_id}':
    delete:
      summary: 'Hapus anggaran'
      operationId: hapusAnggaran
      description: ''
      parameters: []
      responses: {}
      tags:
        - Budgets
    parameters:
      -
        in: path
        name: budget_id
        description: 'The ID of the budget.'
        example: 01a1c555-74ef-7231-9d89-498eed980633
        required: true
        schema:
          type: string
  /api/v1/categories:
    get:
      summary: 'Daftar kategori'
      operationId: daftarKategori
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Categories
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: ''
                  example: expense
                  enum:
                    - income
                    - expense
    post:
      summary: 'Buat kategori'
      operationId: buatKategori
      description: ''
      parameters: []
      responses: {}
      tags:
        - Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: b
                type:
                  type: string
                  description: ''
                  example: expense
                  enum:
                    - income
                    - expense
                icon:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: 'n'
                  nullable: true
                color:
                  type: string
                  description: 'Must match the regex /^#[0-9A-Fa-f]{6}([0-9A-Fa-f]{2})?$/.'
                  example: '#EeDb3B'
                  nullable: true
                parent_id:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: c3b6b42e-3a0f-3935-b28d-cb767f8a2a0a
                  nullable: true
              required:
                - name
                - type
  '/api/v1/categories/{id}':
    put:
      summary: 'Ubah kategori'
      operationId: ubahKategori
      description: ''
      parameters: []
      responses: {}
      tags:
        - Categories
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: b
                icon:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: 'n'
                  nullable: true
                color:
                  type: string
                  description: 'Must match the regex /^#[0-9A-Fa-f]{6}([0-9A-Fa-f]{2})?$/.'
                  example: '#EeDb3B'
                  nullable: true
                parent_id:
                  type: string
                  description: 'Must be a valid UUID. Must not be one of <code></code>.'
                  example: c3b6b42e-3a0f-3935-b28d-cb767f8a2a0a
                  nullable: true
    delete:
      summary: 'Hapus kategori'
      operationId: hapusKategori
      description: ''
      parameters: []
      responses: {}
      tags:
        - Categories
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the category.'
        example: 01a1b9c0-ca5c-70c9-89b2-8435453298e6
        required: true
        schema:
          type: string
  /api/v1/dashboard/summary:
    get:
      summary: 'Ringkasan pemasukan, pengeluaran, dan total saldo'
      operationId: ringkasanPemasukanPengeluaranDanTotalSaldo
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Dashboard
  /api/v1/dashboard/by-category:
    get:
      summary: 'Total per kategori'
      operationId: totalPerKategori
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Dashboard
  /api/v1/recurring-rules/run:
    post:
      summary: 'Jalankan sekarang'
      operationId: jalankanSekarang
      description: 'Membuat semua kemunculan yang sudah jatuh tempo untuk user yang sedang masuk.'
      parameters: []
      responses: {}
      tags:
        - 'Recurring Rules'
  /api/v1/recurring-rules:
    get:
      summary: 'Daftar aturan berulang'
      operationId: daftarAturanBerulang
      description: 'Diurutkan dari kemunculan berikutnya yang paling dekat. `status` dihitung: active, paused, atau finished.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Recurring Rules'
    post:
      summary: 'Buat aturan berulang'
      operationId: buatAturanBerulang
      description: "Jika `start_date` hari ini atau lebih awal (maksimal 366 hari ke belakang), kemunculan yang sudah lewat\nlangsung dibuat."
      parameters: []
      responses: {}
      tags:
        - 'Recurring Rules'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wallet_id:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
                category_id:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: 6b72fe4a-5b40-307c-bc24-f79acf9a1bb9
                  nullable: true
                type:
                  type: string
                  description: ''
                  example: expense
                  enum:
                    - income
                    - expense
                amount:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 9007199254740991.'
                  example: 17
                note:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: i
                  nullable: true
                frequency:
                  type: string
                  description: ''
                  example: daily
                  enum:
                    - daily
                    - weekly
                    - monthly
                start_date:
                  type: string
                  description: 'Must be a valid date in the format <code>Y-m-d</code>. Must be a date after or equal to <code>2025-11-13</code>.'
                  example: '2051-12-07'
                end_date:
                  type: string
                  description: 'Must be a valid date in the format <code>Y-m-d</code>. Must be a date after or equal to <code>start_date</code>.'
                  example: '2052-12-07'
                  nullable: true
              required:
                - wallet_id
                - type
                - amount
                - frequency
                - start_date
  '/api/v1/recurring-rules/{rule_id}':
    patch:
      summary: 'Ubah aturan'
      operationId: ubahAturan
      description: "Dompet, kategori, nominal, catatan, `end_date`, dan `is_active` bisa diubah; frekuensi dan `start_date` tidak.\nPerubahan nominal hanya berlaku untuk kemunculan berikutnya. Mengaktifkan kembali aturan memvalidasi ulang\ndompet dan kategori, dan menggeser kemunculan berikutnya ke hari ini atau sesudahnya (masa jeda tidak disusul)."
      parameters: []
      responses: {}
      tags:
        - 'Recurring Rules'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                wallet_id:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
                category_id:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: 6b72fe4a-5b40-307c-bc24-f79acf9a1bb9
                  nullable: true
                amount:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 9007199254740991.'
                  example: 17
                note:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: i
                  nullable: true
                end_date:
                  type: string
                  description: 'Must be a valid date in the format <code>Y-m-d</code>. Must be a date after or equal to <code>2026-11-14</code>.'
                  example: '2052-12-07'
                  nullable: true
                is_active:
                  type: boolean
                  description: ''
                  example: false
    delete:
      summary: 'Hapus aturan'
      operationId: hapusAturan
      description: 'Soft delete. Transaksi yang sudah dibuat tetap ada.'
      parameters: []
      responses: {}
      tags:
        - 'Recurring Rules'
    parameters:
      -
        in: path
        name: rule_id
        description: 'The ID of the rule.'
        example: 01a1d8d7-d03d-7004-8285-1e6b5522b84e
        required: true
        schema:
          type: string
  /api/v1/reports/monthly-trend:
    get:
      summary: 'Tren bulanan'
      operationId: trenBulanan
      description: 'Pemasukan, pengeluaran, dan selisih per bulan; tepat `months` item, berakhir di bulan berjalan.'
      parameters:
        -
          in: query
          name: months
          description: '6 atau 12. Default 6.'
          example: 6
          required: false
          schema:
            type: integer
            description: '6 atau 12. Default 6.'
            example: 6
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Reports
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                months:
                  type: string
                  description: ''
                  example: null
  /api/v1/reports/category-comparison:
    get:
      summary: 'Rincian kategori lintas bulan'
      operationId: rincianKategoriLintasBulan
      description: ''
      parameters:
        -
          in: query
          name: months
          description: '3 sampai 12. Default 6.'
          example: 6
          required: false
          schema:
            type: integer
            description: '3 sampai 12. Default 6.'
            example: 6
        -
          in: query
          name: type
          description: 'expense atau income. Default expense.'
          example: expense
          required: false
          schema:
            type: string
            description: 'expense atau income. Default expense.'
            example: expense
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Reports
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                months:
                  type: integer
                  description: 'Must be between 3 and 12.'
                  example: 4
                type:
                  type: string
                  description: ''
                  example: null
  /api/v1/reports/wallets:
    get:
      summary: 'Laporan per dompet'
      operationId: laporanPerDompet
      description: "Pemasukan, pengeluaran, dan transfer per dompet pada rentang tanggal (Asia/Jakarta, inklusif),\nserta saldo akhir pada akhir hari `to`. Rentang maksimum 366 hari."
      parameters:
        -
          in: query
          name: from
          description: 'Tanggal awal `YYYY-MM-DD`. Default awal bulan berjalan.'
          example: '2026-11-01'
          required: false
          schema:
            type: string
            description: 'Tanggal awal `YYYY-MM-DD`. Default awal bulan berjalan.'
            example: '2026-11-01'
        -
          in: query
          name: to
          description: 'Tanggal akhir `YYYY-MM-DD`. Default akhir bulan berjalan.'
          example: '2026-11-30'
          required: false
          schema:
            type: string
            description: 'Tanggal akhir `YYYY-MM-DD`. Default akhir bulan berjalan.'
            example: '2026-11-30'
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Reports
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  description: 'Must be a valid date in the format <code>Y-m-d</code>.'
                  example: '2026-11-14'
                to:
                  type: string
                  description: 'Must be a valid date in the format <code>Y-m-d</code>.'
                  example: '2026-11-14'
  /api/v1/transactions/export:
    get:
      summary: 'Ekspor transaksi ke CSV'
      operationId: eksporTransaksiKeCSV
      description: "Filter sama seperti daftar transaksi, tanpa paginasi. Berkas UTF-8 dengan BOM, waktu dalam WIB,\nurut dari yang terbaru. Maksimum 50.000 baris (lebih dari itu 422: persempit filter)."
      parameters:
        -
          in: query
          name: wallet_id
          description: 'UUID dompet.'
          example: 0198f0a0-0000-7000-8000-000000000000
          required: false
          schema:
            type: string
            description: 'UUID dompet.'
            example: 0198f0a0-0000-7000-8000-000000000000
        -
          in: query
          name: category_id
          description: 'UUID kategori.'
          example: architecto
          required: false
          schema:
            type: string
            description: 'UUID kategori.'
            example: architecto
        -
          in: query
          name: type
          description: 'income, expense, transfer_out, atau transfer_in.'
          example: architecto
          required: false
          schema:
            type: string
            description: 'income, expense, transfer_out, atau transfer_in.'
            example: architecto
        -
          in: query
          name: from
          description: 'Tanggal awal `YYYY-MM-DD` (Asia/Jakarta).'
          example: '2026-11-01'
          required: false
          schema:
            type: string
            description: 'Tanggal awal `YYYY-MM-DD` (Asia/Jakarta).'
            example: '2026-11-01'
        -
          in: query
          name: to
          description: 'Tanggal akhir `YYYY-MM-DD` (Asia/Jakarta, inklusif).'
          example: '2026-11-30'
          required: false
          schema:
            type: string
            description: 'Tanggal akhir `YYYY-MM-DD` (Asia/Jakarta, inklusif).'
            example: '2026-11-30'
        -
          in: query
          name: q
          description: 'Cari di catatan.'
          example: architecto
          required: false
          schema:
            type: string
            description: 'Cari di catatan.'
            example: architecto
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Transactions
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                wallet_id:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
                category_id:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: 6b72fe4a-5b40-307c-bc24-f79acf9a1bb9
                type:
                  type: string
                  description: ''
                  example: null
                from:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-11-14T07:11:28'
                to:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-11-14T07:11:28'
                q:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: m
  /api/v1/transactions:
    get:
      summary: 'Daftar transaksi (paginasi cursor)'
      operationId: daftarTransaksipaginasiCursor
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Transactions
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                wallet_id:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
                category_id:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: 6b72fe4a-5b40-307c-bc24-f79acf9a1bb9
                type:
                  type: string
                  description: ''
                  example: null
                from:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-11-14T07:11:28'
                to:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-11-14T07:11:28'
                q:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: m
                per_page:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 100.'
                  example: 15
    post:
      summary: 'Buat transaksi'
      operationId: buatTransaksi
      description: ''
      parameters: []
      responses: {}
      tags:
        - Transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wallet_id:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
                category_id:
                  type: string
                  description: 'Must be a valid UUID.'
